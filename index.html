<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day Order — Class Timetable</title>
<style>
  :root{
    --ink:#0f2a4a;
    --board:#ffffff;
    --board-dark:#eef4fc;
    --chalk:#102a43;
    --chalk-dim:#5b7a9d;
    --accent:#1d63e0;
    --accent-dim:#154fb8;
    --teal:#2f7fd1;
    --danger:#d1495b;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--board);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(29,99,224,0.05), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(29,99,224,0.06), transparent 45%);
    color:var(--chalk);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:22px 18px 0;}

  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px;}
  .clock-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;}
  .clock{font-size:15px;color:var(--chalk-dim);font-variant-numeric:tabular-nums;}
  .date{font-size:15px;color:var(--chalk-dim);}

  .bell-card{
    background:var(--board-dark);
    border:1px solid rgba(29,99,224,0.14);
    border-radius:20px;
    padding:26px 22px 22px;
    position:relative;
    overflow:hidden;
    margin-bottom:16px;
    box-shadow:0 6px 20px rgba(29,99,224,0.08);
  }
  .bell-card::before{
    content:"";position:absolute;top:-60px;right:-60px;width:160px;height:160px;border-radius:50%;
    background:radial-gradient(circle, rgba(29,99,224,0.14), transparent 70%);
  }
  .day-order-badge{
    display:inline-block;
    background:rgba(29,99,224,0.12);
    color:var(--accent);
    font-size:12px;font-weight:800;letter-spacing:.08em;
    padding:4px 10px;border-radius:20px;
    margin-bottom:12px;
  }
  .period-label{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--teal);font-weight:700;margin-bottom:8px;}
  .period-name{font-size:32px;font-weight:800;line-height:1.15;margin:0 0 10px;letter-spacing:-0.01em;color:var(--ink);}
  .period-time{font-size:14px;color:var(--chalk-dim);margin-bottom:16px;}
  .arc-wrap{display:flex;align-items:center;gap:14px;}
  .arc-track{flex:1;height:8px;border-radius:8px;background:rgba(29,99,224,0.1);overflow:hidden;}
  .arc-fill{height:100%;background:linear-gradient(90deg, var(--accent-dim), var(--accent));border-radius:8px;transition:width .4s ease;}
  .arc-pct{font-size:12px;color:var(--chalk-dim);min-width:34px;text-align:right;}

  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--chalk-dim);font-weight:700;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center;}
  .section-title .toggle{color:var(--accent);cursor:pointer;font-weight:700;text-transform:none;letter-spacing:0;font-size:12px;}

  .period-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .period-item{display:flex;align-items:center;gap:12px;background:#f7fafd;border:1px solid rgba(29,99,224,0.10);border-radius:var(--radius);padding:12px 14px;}
  .period-item.active{background:rgba(29,99,224,0.09);border-color:rgba(29,99,224,0.4);}
  .period-item .dot{width:8px;height:8px;border-radius:50%;background:var(--chalk-dim);flex-shrink:0;}
  .period-item.active .dot{background:var(--accent);}
  .p-main{flex:1;min-width:0;}
  .p-name{font-weight:700;font-size:15px;color:var(--ink);}
  .p-time{font-size:12px;color:var(--chalk-dim);}

  .week-grid{width:100%;border-collapse:collapse;font-size:12px;background:#f7fafd;border-radius:var(--radius);overflow:hidden;}
  .week-grid th,.week-grid td{border:1px solid rgba(29,99,224,0.1);padding:8px 6px;text-align:center;}
  .week-grid th{background:rgba(29,99,224,0.08);color:var(--chalk-dim);font-weight:700;}
  .week-grid td.today-row{background:rgba(29,99,224,0.1);}
  .week-grid td:first-child, .week-grid th:first-child{font-weight:800;color:var(--accent);}

  .holiday-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .holiday-item{display:flex;align-items:center;justify-content:space-between;background:#f7fafd;border:1px solid rgba(29,99,224,0.10);border-radius:10px;padding:8px 12px;font-size:13px;}
  .holiday-item span.hname{color:var(--chalk-dim);}
  .icon-btn{background:none;border:none;color:var(--chalk-dim);font-size:15px;cursor:pointer;padding:4px 6px;border-radius:8px;}
  .icon-btn:hover{color:var(--danger);background:rgba(29,99,224,0.08);}

  form.add-form{margin-top:10px;background:#f7fafd;border:1px dashed rgba(29,99,224,0.25);border-radius:var(--radius);padding:14px;display:grid;gap:10px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--chalk-dim);margin-bottom:4px;display:block;}
  input[type=text], input[type=date]{width:100%;background:#ffffff;border:1px solid rgba(29,99,224,0.2);color:var(--chalk);border-radius:9px;padding:9px 10px;font-size:14px;}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .add-btn{background:var(--accent);color:#ffffff;border:none;font-weight:700;padding:10px;border-radius:9px;cursor:pointer;font-size:14px;}
  .add-btn:hover{background:var(--accent-dim);}
  .status-msg{font-size:12px;color:var(--teal);margin-top:2px;min-height:14px;}

  .hidden{display:none;}
  .note{font-size:12px;color:var(--chalk-dim);line-height:1.5;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Day Order</div>
  <div class="clock-row">
    <div class="date" id="dateStr">—</div>
    <div class="clock" id="clockStr">—</div>
  </div>

  <div class="bell-card">
    <div class="day-order-badge" id="dayOrderBadge">—</div>
    <div class="period-label" id="statusLabel">Now</div>
    <h1 class="period-name" id="currentPeriod">Loading…</h1>
    <div class="period-time" id="currentPeriodTime">&nbsp;</div>
    <div class="arc-wrap" id="arcWrap" style="display:none;">
      <div class="arc-track"><div class="arc-fill" id="arcFill" style="width:0%"></div></div>
      <div class="arc-pct" id="arcPct">0%</div>
    </div>
  </div>

  <div class="section-title">Today's periods</div>
  <ul class="period-list" id="periodList"></ul>

  <div class="section-title">
    <span>Weekly timetable (Day I–VI)</span>
    <span class="toggle" id="weekToggle">Show</span>
  </div>
  <div id="weekSection" class="hidden">
    <table class="week-grid" id="weekGrid"></table>
  </div>

  <div class="section-title">
    <span>Holidays / Leave days</span>
    <span class="toggle" id="holidayToggle">Show</span>
  </div>
  <div id="holidaySection" class="hidden">
    <ul class="holiday-list" id="holidayList"></ul>
    <form class="add-form" id="holidayForm">
      <div class="row2">
        <div>
          <label for="holDate">Date</label>
          <input type="date" id="holDate" required>
        </div>
        <div>
          <label for="holName">Reason (optional)</label>
          <input type="text" id="holName" placeholder="e.g. Milad-un-Nabi">
        </div>
      </div>
      <button type="submit" class="add-btn">Add holiday</button>
    </form>
    <div class="note">Andha date la day order skip aagum — next working day andha day order continue aagum. Sat/Sun automatic ah off.</div>
    <div class="status-msg" id="statusMsg">&nbsp;</div>
  </div>
</div>

<script>
const KEY_TIMETABLE = "timetable:subjects:v2";
const KEY_HOLIDAYS = "timetable:holidays";

const periodTimes = [
  {start:"09:00", end:"09:50"},
  {start:"09:50", end:"10:40"},
  {start:"10:40", end:"11:30"},
  {start:"11:30", end:"12:20"},
  {start:"12:20", end:"13:10"},
];

const defaultTimetable = {
  1: ["DBMS", "OS", "Project", "CN", "VE"],
  2: ["NM", "DBMS", "OS LAB", "OS LAB", "Project"],
  3: ["CN", "OS", "Project", "NM", "VE"],
  4: ["DBMS", "OS", "CN", "DBMS LAB", "DBMS LAB"],
  5: ["NM", "DBMS", "OS", "DBMS LAB", "Project"],
  6: ["CN", "OS LAB", "OS LAB", "NM", "Project"],
};

const ANCHOR_DATE = "2026-08-03";
const ANCHOR_ORDER = 5;

const defaultHolidays = [
  { date: "2026-08-15", name: "Suthanthira Dinam" },
  { date: "2026-08-26", name: "Milad-un-Nabi" },
];

const dayRoman = {1:"I", 2:"II", 3:"III", 4:"IV", 5:"V", 6:"VI"};

let timetable = {};
let holidays = [];

function ymd(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function dateOnly(d){
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function isWorkingDay(d){
  const dow = d.getDay();
  if(dow===0 || dow===6) return false;
  if(holidays.some(h=>h.date===ymd(d))) return false;
  return true;
}
function computeDayOrder(target){
  const anchor = dateOnly(new Date(ANCHOR_DATE + "T00:00:00"));
  const t = dateOnly(target);
  let order = ANCHOR_ORDER;
  if(t.getTime() === anchor.getTime()) return order;
  const step = t > anchor ? 1 : -1;
  let cur = new Date(anchor);
  while(cur.getTime() !== t.getTime()){
    cur.setDate(cur.getDate() + step);
    if(isWorkingDay(cur)){
      if(step === 1) order = order % 6 + 1;
      else order = (order - 2 + 6) % 6 + 1;
    }
  }
  return order;
}

function toMinutes(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  return h*60+m;
}
function fmt12(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return `${h12}:${String(m).padStart(2,"0")} ${period}`;
}

async function loadData(){
  try{
    const res = await window.storage.get(KEY_TIMETABLE, false);
    timetable = res && res.value ? JSON.parse(res.value) : JSON.parse(JSON.stringify(defaultTimetable));
  }catch(e){
    timetable = JSON.parse(JSON.stringify(defaultTimetable));
  }
  try{
    const res2 = await window.storage.get(KEY_HOLIDAYS, false);
    holidays = res2 && res2.value ? JSON.parse(res2.value) : JSON.parse(JSON.stringify(defaultHolidays));
  }catch(e){
    holidays = JSON.parse(JSON.stringify(defaultHolidays));
  }
  await saveTimetable();
  await saveHolidays();
  renderWeekGrid();
  renderHolidays();
  updateClock();
}

async function saveTimetable(){
  try{ await window.storage.set(KEY_TIMETABLE, JSON.stringify(timetable), false); }
  catch(e){ setStatus("Couldn't save timetable."); }
}
async function saveHolidays(){
  try{ await window.storage.set(KEY_HOLIDAYS, JSON.stringify(holidays), false); }
  catch(e){ setStatus("Couldn't save holiday."); }
}
function setStatus(msg){
  const el = document.getElementById("statusMsg");
  if(!el) return;
  el.textContent = msg || "\u00A0";
  if(msg) setTimeout(()=>{ if(el.textContent === msg) el.textContent = "\u00A0"; }, 2500);
}

function updateClock(){
  const now = new Date();
  document.getElementById("dateStr").textContent = now.toLocaleDateString(undefined,{weekday:"long", month:"short", day:"numeric"});
  document.getElementById("clockStr").textContent = now.toLocaleTimeString(undefined,{hour:"2-digit", minute:"2-digit", second:"2-digit"});

  const working = isWorkingDay(now);
  const order = computeDayOrder(now);
  const badge = document.getElementById("dayOrderBadge");
  badge.textContent = working ? `Day Order ${dayRoman[order]}` : "No class today";

  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  const label = document.getElementById("statusLabel");
  const nameEl = document.getElementById("currentPeriod");
  const timeEl = document.getElementById("currentPeriodTime");
  const arcWrap = document.getElementById("arcWrap");

  let activeIdx = -1;
  if(working){
    const subjects = timetable[order] || [];
    let current = null, currentIdx = -1;
    for(let i=0;i<periodTimes.length;i++){
      const s = toMinutes(periodTimes[i].start), e = toMinutes(periodTimes[i].end);
      if(nowMin >= s && nowMin < e){ current = subjects[i]; currentIdx = i; break; }
    }
    if(current){
      label.textContent = "Now — Period " + (currentIdx+1);
      nameEl.textContent = current;
      timeEl.textContent = `${fmt12(periodTimes[currentIdx].start)} – ${fmt12(periodTimes[currentIdx].end)}`;
      const s = toMinutes(periodTimes[currentIdx].start), e = toMinutes(periodTimes[currentIdx].end);
      const pct = Math.min(100, Math.max(0, ((nowMin - s) / (e - s)) * 100));
      document.getElementById("arcFill").style.width = pct.toFixed(0) + "%";
      document.getElementById("arcPct").textContent = pct.toFixed(0) + "%";
      arcWrap.style.display = "flex";
      activeIdx = currentIdx;
    } else {
      let next = null, nextIdx = -1;
      for(let i=0;i<periodTimes.length;i++){
        if(toMinutes(periodTimes[i].start) > nowMin){ next = subjects[i]; nextIdx = i; break; }
      }
      if(next){
        label.textContent = "Up next — Period " + (nextIdx+1);
        nameEl.textContent = next;
        timeEl.textContent = `Starts at ${fmt12(periodTimes[nextIdx].start)}`;
      } else {
        label.textContent = "Today";
        nameEl.textContent = "College over for today";
        timeEl.textContent = "See you next working day";
      }
      arcWrap.style.display = "none";
    }
  } else {
    label.textContent = "Today";
    const h = holidays.find(x=>x.date===ymd(now));
    const isWeekend = now.getDay()===0 || now.getDay()===6;
    nameEl.textContent = isWeekend ? "Weekend — No class" : (h ? h.name : "Holiday — No class");
    timeEl.textContent = "\u00A0";
    arcWrap.style.display = "none";
  }

  renderTodayList(working, order, activeIdx);
}

function renderTodayList(working, order, activeIdx){
  const list = document.getElementById("periodList");
  list.innerHTML = "";
  if(!working){
    const li = document.createElement("li");
    li.className = "period-item";
    li.innerHTML = `<span class="dot"></span><div class="p-main"><div class="p-name">No periods today</div></div>`;
    list.appendChild(li);
    return;
  }
  const subjects = timetable[order] || [];
  subjects.forEach((subj,i)=>{
    const li = document.createElement("li");
    li.className = "period-item" + (i===activeIdx ? " active" : "");
    li.innerHTML = `
      <span class="dot"></span>
      <div class="p-main">
        <div class="p-name">P${i+1} — ${subj}</div>
        <div class="p-time">${fmt12(periodTimes[i].start)} – ${fmt12(periodTimes[i].end)}</div>
      </div>`;
    list.appendChild(li);
  });
}

function renderWeekGrid(){
  const table = document.getElementById("weekGrid");
  const todayOrder = isWorkingDay(new Date()) ? computeDayOrder(new Date()) : null;
  let html = "<tr><th>Day</th>" + periodTimes.map((_,i)=>`<th>P${i+1}</th>`).join("") + "</tr>";
  for(let d=1; d<=6; d++){
    const isToday = d === todayOrder;
    html += `<tr>${isToday?'<td class="today-row">':'<td>'}${dayRoman[d]}</td>`;
    timetable[d].forEach(subj=>{
      html += `${isToday?'<td class="today-row">':'<td>'}${subj}</td>`;
    });
    html += "</tr>";
  }
  table.innerHTML = html;
}

function renderHolidays(){
  const list = document.getElementById("holidayList");
  list.innerHTML = "";
  if(holidays.length === 0){
    list.innerHTML = `<li class="holiday-item"><span class="hname">No holidays added</span></li>`;
    return;
  }
  holidays
    .slice()
    .sort((a,b)=> a.date.localeCompare(b.date))
    .forEach(h=>{
      const li = document.createElement("li");
      li.className = "holiday-item";
      const d = new Date(h.date + "T00:00:00");
      const label = d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
      li.innerHTML = `<span class="hname">${label} — ${h.name || "Holiday"}</span>`;
      const btn = document.createElement("button");
      btn.className = "icon-btn";
      btn.textContent = "✕";
      btn.addEventListener("click", async ()=>{
        holidays = holidays.filter(x=>x.date!==h.date);
        await saveHolidays();
        renderHolidays();
        renderWeekGrid();
        updateClock();
        setStatus("Holiday removed.");
      });
      li.appendChild(btn);
      list.appendChild(li);
    });
}

document.getElementById("holidayForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const date = document.getElementById("holDate").value;
  const name = document.getElementById("holName").value.trim();
  if(!date) return;
  if(holidays.some(h=>h.date===date)){
    setStatus("Already added.");
    return;
  }
  holidays.push({date, name});
  await saveHolidays();
  renderHolidays();
  renderWeekGrid();
  updateClock();
  e.target.reset();
  setStatus("Holiday added.");
});

document.getElementById("weekToggle").addEventListener("click", ()=>{
  const sec = document.getElementById("weekSection");
  const open = !sec.classList.contains("hidden");
  sec.classList.toggle("hidden");
  document.getElementById("weekToggle").textContent = open ? "Show" : "Hide";
});
document.getElementById("holidayToggle").addEventListener("click", ()=>{
  const sec = document.getElementById("holidaySection");
  const open = !sec.classList.contains("hidden");
  sec.classList.toggle("hidden");
  document.getElementById("holidayToggle").textContent = open ? "Show" : "Hide";
});

loadData();
setInterval(updateClock, 1000);
</script>
</body>
</html>
